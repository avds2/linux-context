# max = deepest safe/read-only understanding, not maximal bytes.
LCTX_COMMAND_TIMEOUT=30
LCTX_COMMAND_MAX_BYTES=2097152
# Hard retained-evidence ceiling. Structured context is canonical; evidence is
# ranked by diagnostic priority and excess low-value captures are dropped.
LCTX_EVIDENCE_BUDGET_BYTES=6291456
# context.json is the AI entrypoint and must remain prompt-sized even on hosts
# with thousands of services/containers. Overflow graph state is deferred to a
# machine-readable sidecar rather than discarded.
LCTX_CONTEXT_BUDGET_BYTES=131072
LCTX_LOG_SINCE='7 days ago'
LCTX_MAX_ITEMS=10000
# Bounded parallelism lowers latency without making inspection itself a workload.
LCTX_JOBS=3
LCTX_LOG_SAMPLE_ITEMS=200
LCTX_SIGNATURE_ITEMS=200
