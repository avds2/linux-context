name: Bug report
description: Report a reproducible linux-context defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach an unreviewed diagnostic bundle to a public issue.** Bundles are redacted defensively, but they intentionally contain infrastructure details. Share only the minimum sanitized excerpts needed to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: linux-context version
      description: Output of `./bin/linux-context --version`; for checkouts also include `git rev-parse HEAD`. Unreleased checkouts can share a version string with a release.
      placeholder: linux-context 1.0.0
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [quick, standard, deep, max]
    validations:
      required: true
  - type: input
    id: targets
    attributes:
      label: Target expression
      placeholder: e.g. auto OR all OR network,docker
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution/version, kernel, architecture, Bash/Python versions, privilege/container mode, and relevant subsystem versions. Remove hostnames, addresses, IDs, and secrets unless required.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact command, jobs/output options and whether collection, publication or archive creation failed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / sanitized logs
      description: Include minimal reviewed stderr and relevant validation/telemetry fields; do not post raw staging or unreviewed bundles.
    validations:
      required: true
